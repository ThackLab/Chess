<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#302e2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Grandmasters" />
    <meta name="description" content="Play bots from 100 to 3200 Elo, get free in-depth game reviews and analyse any PGN." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Grandmasters</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--splash-bg, #302e2b);
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: var(--splash-bg, #302e2b);
        color: var(--splash-text, #fff);
        font:
          800 1.35rem/1.2 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        letter-spacing: -0.01em;
      }
      .splash svg {
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        animation: splash-in 0.5s ease-out both;
      }
      .splash-name {
        animation: splash-in 0.5s 0.08s ease-out both;
      }
      .splash-bar {
        width: 120px;
        height: 4px;
        border-radius: 4px;
        overflow: hidden;
        background: color-mix(in srgb, var(--splash-text, #fff) 18%, transparent);
      }
      .splash-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: var(--splash-accent, #81b64c);
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes splash-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash *,
        .splash {
          animation: none !important;
        }
      }
    </style>
    <script>
      // The splash takes the saved theme's colours, so it matches what comes next.
      (function () {
        var looks = {
          club: ['#302e2b', '#fff', '#81b64c'],
          gothic: ['#120c26', '#f4efff', '#9d6bff'],
          blossom: ['#ffe6f0', '#3d1230', '#ff4f9a'],
          aurora: ['#04121a', '#eafff6', '#23bf7d'],
          synthwave: ['#160028', '#fdeaff', '#ff3d9a'],
          deepsea: ['#03182b', '#e6f6ff', '#159fd8'],
          forest: ['#081a10', '#effbe6', '#6fb53a'],
          desert: ['#2a1230', '#fff1e0', '#f08a2e'],
          noir: ['#000', '#f5f5f5', '#fff'],
          paper: ['#f5f0e6', '#1c1a17', '#1c1a17'],
          contrast: ['#000', '#fff', '#ffd60a'],
          clear: ['#101418', '#f5f7fa', '#ffcc00'],
        };
        try {
          var theme = JSON.parse(localStorage.getItem('grandmasters.settings') || '{}').state.theme;
          var l = looks[theme];
          if (l) {
            var r = document.documentElement.style;
            r.setProperty('--splash-bg', l[0]);
            r.setProperty('--splash-text', l[1]);
            r.setProperty('--splash-accent', l[2]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Shown from the first frame until the app has started (React replaces it). -->
    <div id="root">
      <div class="splash" role="status" aria-label="Loading Grandmasters">
        <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#fff" />
          <path fill="#000" d="M22 50h20l-2-6H24zm3-8h14l-2-12 4-4-3-8h-4l-1 3h-2l-1-3h-4l-3 8 4 4z" />
        </svg>
        <div class="splash-name">Grandmasters</div>
        <div class="splash-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

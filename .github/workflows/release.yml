name: Release the Android app

# When the version in package.json has no release yet, this builds the APK
# from the code on main and publishes it as a GitHub Release (tag v<version>),
# with its SHA-256 fingerprint and a link to this build's public log.
# To release: bump "version" in package.json and push to main, or run this
# workflow from the Actions tab.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The Android version code counts commits, so newer builds install over older ones.
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; bump the version in package.json to make a new release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.v.outputs.new == 'true'
        run: npm ci
      - if: steps.v.outputs.new == 'true'
        run: npm test
      - uses: actions/setup-java@v4
        if: steps.v.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: 17
      - if: steps.v.outputs.new == 'true'
        run: ./android/build-apk.sh
      - name: Fingerprint
        if: steps.v.outputs.new == 'true'
        run: |
          cd android/build
          sha256sum grandmasters.apk > grandmasters.apk.sha256
          cat grandmasters.apk.sha256
          echo "SHA256=$(cut -d' ' -f1 grandmasters.apk.sha256)" >> "$GITHUB_ENV"
          echo "### grandmasters.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$(cut -d' ' -f1 grandmasters.apk.sha256)\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        if: steps.v.outputs.new == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > notes.md <<EOF
          **Android:** download \`grandmasters.apk\` below, open it, and allow installing from that app when Android asks.

          Built by GitHub Actions from commit $GITHUB_SHA, nothing added by hand. The full build log is public: $run_url

          SHA-256 of \`grandmasters.apk\`: \`$SHA256\`
          EOF
          gh release create "$TAG" android/build/grandmasters.apk android/build/grandmasters.apk.sha256 \
            --target "$GITHUB_SHA" --title "Grandmasters $TAG" --notes-file notes.md --latest
